name: Bug
description: Something on the site is broken.
title: '[bug] '
labels: [bug]
body:
  - type: input
    id: url
    attributes: { label: Page URL }
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations: { required: true }
  - type: input
    id: env
    attributes: { label: Device / browser / screen width }
