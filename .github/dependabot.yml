version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      dev-tooling:
        patterns: ['@biomejs/*', 'vitest', '@playwright/*', 'typescript', 'lefthook']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
